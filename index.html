<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SENSE Web Receiver</title>
<style>
body { margin:0; background:black; color:white; font-family:Arial }
button { position:absolute; top:10px; left:10px; }
canvas { display:block }
</style>
</head>

<body>
<button onclick="connectBLE()">Connect BLE</button>
<canvas id="c" width="1100" height="800"></canvas>

<script>
/* ================= BLE ================= */
const SERVICE_UUID = "00001234-0000-1000-8000-00805f9b34fb";
const RX_UUID      = "00004567-0000-1000-8000-00805f9b34fb";
const CMD_UUID     = "00009999-0000-1000-8000-00805f9b34fb";

let rxChar, cmdChar;
let gattBusy = false;

/* ================= DATA ================= */
let adc = Array(8).fill(0);
let imu = Array(6).fill(0);
let mic = 0;
let ir = 0;
let motorOn = 0;
let flags = 0;
let pkt = 0;

/* IR waveform */
let irBuf = Array(400).fill(0), irIdx = 0;

/* ================= BLE CONNECT ================= */
async function connectBLE() {
  const dev = await navigator.bluetooth.requestDevice({
    filters:[{name:"SENSE-SENDER"}],
    optionalServices:[SERVICE_UUID]
  });

  const srv = await dev.gatt.connect();
  const svc = await srv.getPrimaryService(SERVICE_UUID);

  rxChar  = await svc.getCharacteristic(RX_UUID);
  cmdChar = await svc.getCharacteristic(CMD_UUID);

  await rxChar.startNotifications();
  rxChar.addEventListener("characteristicvaluechanged", onPacket);
}

/* ================= PACKET PARSE ================= */
function onPacket(e) {
  const v = new Uint8Array(e.target.value.buffer);

  for (let i=0;i<8;i++) adc[i] = v[i];
  for (let i=0;i<6;i++) imu[i] = (v[8+i]>127)?v[8+i]-256:v[8+i];

  mic = v[14];
  ir  = (v[15]<<8)|v[16];
  motorOn = v[17];
  flags = v[18];
  pkt = v[19];

  irBuf[irIdx] = ir;
  irIdx = (irIdx+1)%irBuf.length;

  /* ==== RECEIVER LOGIC ==== */
  if (mic > 100) requestMotorPulse();

  /* ==== CSV OUTPUT ==== */
  let csv =
    adc.join(",") + "," +
    imu.map(x=>x.toFixed(2)).join(",") + "," +
    mic + "," + ir + "," +
    motorOn + "," + flags + "," + pkt;

  console.log(csv);
}

/* ================= MOTOR COMMAND ================= */
async function requestMotorPulse() {
  if (!cmdChar || gattBusy) return;
  gattBusy = true;

  try {
    await cmdChar.writeValueWithoutResponse(new Uint8Array([1]));
  } catch {}

  setTimeout(()=>gattBusy=false, 120);
}

/* ================= DRAW ================= */
const ctx = document.getElementById("c").getContext("2d");

function draw() {
  ctx.fillStyle="black";
  ctx.fillRect(0,0,1100,800);

  // ADC bars
  for (let i=0;i<8;i++) {
    ctx.fillStyle="cyan";
    ctx.fillRect(40+i*120,300,60,-adc[i]*2);
  }

  // Mic
  ctx.fillStyle="lime";
  ctx.fillRect(40,360,mic*2,30);

  // IR waveform
  ctx.strokeStyle="red";
  ctx.beginPath();
  for (let i=0;i<irBuf.length;i++) {
    ctx.lineTo(40+i,700-irBuf[i]/400);
  }
  ctx.stroke();

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
