<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SENSE Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  button {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 10px 16px;
    font-size: 14px;
    z-index: 10;
  }
  #motorBtn {
    top: 60px;
    background: rgb(40,120,40);
  }
</style>
</head>

<body>

<button onclick="connectBLE()">Connect BLE</button>
<button id="motorBtn" onclick="pulseMotor()">PULSE MOTOR</button>

<canvas id="c" width="1100" height="800"></canvas>

<script>
/* ================= BLE UUIDs ================= */
const SERVICE_UUID = "00001234-0000-1000-8000-00805f9b34fb";
const RX_UUID      = "00004567-0000-1000-8000-00805f9b34fb";
const CMD_UUID     = "00009999-0000-1000-8000-00805f9b34fb";

let device, rxChar, cmdChar;
let gattBusy = false;

/* ================= CANVAS ================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* ================= DATA ================= */
let adc = new Array(8).fill(0);
let imu = new Array(6).fill(0);
let mic = 0;
let ir = 0;
let motorOn = false;
let flags = 0;
let pkt = 0;

let irBuffer = new Array(400).fill(0);
let irIndex = 0;

/* ================= BLE CONNECT ================= */
async function connectBLE() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "SENSE-SENDER" }],
      optionalServices: [SERVICE_UUID]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    rxChar  = await service.getCharacteristic(RX_UUID);
    cmdChar = await service.getCharacteristic(CMD_UUID);

    await rxChar.startNotifications();
    rxChar.addEventListener("characteristicvaluechanged", onPacket);

    console.log("CMD properties:", cmdChar.properties);
    alert("✅ BLE Connected");
  } catch (e) {
    if (e.name !== "NotFoundError") console.error(e);
  }
}

/* ================= PACKET PARSE ================= */
function onPacket(e) {
  const v = new Uint8Array(e.target.value.buffer);
  if (v.length !== 20) return;

  for (let i = 0; i < 8; i++) adc[i] = v[i];

  for (let i = 0; i < 6; i++) {
    let x = v[8 + i];
    imu[i] = (x > 127) ? x - 256 : x;
  }

  mic = v[14];
  ir  = (v[15] << 8) | v[16];
  motorOn = v[17] === 1;
  flags = v[18];
  pkt = v[19];

  irBuffer[irIndex] = ir;
  irIndex = (irIndex + 1) % irBuffer.length;
}

/* ================= MOTOR COMMAND ================= */
async function pulseMotor() {
  if (!cmdChar || gattBusy) return;
  gattBusy = true;

  try {
    await cmdChar.writeValueWithoutResponse(new Uint8Array([1]));
    console.log("✅ Motor command sent");
  } catch (e) {
    console.error("Motor command failed", e);
  }

  setTimeout(() => gattBusy = false, 200);
}

/* ================= DRAW LOOP ================= */
function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawADC(40, 40);
  drawIMU(600, 40);
  drawMic(40, 330);
  drawFlags(600, 330);
  drawIR(40, 530);
  drawPacket(600, 720);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ================= UI ================= */
function drawADC(x, y) {
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("ADC Channels", x, y - 15);

  for (let i = 0; i < 8; i++) {
    let h = adc[i] * 2.2;
    ctx.fillStyle = "rgb(0,180,255)";
    ctx.fillRect(x + i * 110, y + 220 - h, 70, h);
  }
}

function drawIMU(x, y) {
  y += 200;
  for (let i = 0; i < 6; i++) {
    let v = imu[i];
    ctx.fillStyle = "rgb(255,120,0)";
    ctx.fillRect(x + i * 45, y + 200, 35, -v);
  }
}

function drawMic(x, y) {
  ctx.fillStyle = "white";
  ctx.fillText("Mic: " + mic, x, y + 30);
  ctx.fillStyle = "lime";
  ctx.fillRect(x, y + 45, mic * 1.4, 40);
}

function drawIR(x, y) {
  ctx.strokeStyle = "red";
  ctx.beginPath();
  for (let i = 0; i < irBuffer.length; i++) {
    ctx.lineTo(x + i, y + 200 - irBuffer[i] / 400);
  }
  ctx.stroke();
}

function drawFlags(x, y) {
  y += 200;
  ctx.fillStyle = "white";
  ctx.fillText("Flags: " + flags, x, y);
}

function drawPacket(x, y) {
  ctx.fillStyle = "white";
  ctx.fillText("Packet: " + pkt, x, y);
}
</script>

</body>
</html>
